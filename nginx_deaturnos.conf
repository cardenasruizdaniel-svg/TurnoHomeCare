server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================================
    # DEATurnos BACKEND API (Puerto 5000)
    # ==========================================================
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================
    # DEAVisitas BACKEND API (Puerto 5001)
    # ==========================================================
    location /visitas/api/ {
        proxy_pass http://127.0.0.1:5001/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================
    # DEACotizador (Puerto 3000)
    # ==========================================================
    location /cotizador/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================
    # DEAClinica (Puerto 8721)
    # ==========================================================
    location /clinica/ {
        proxy_pass http://127.0.0.1:8721/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect ~^https?://[^/]+/(.*)$ /clinica/$1;
        proxy_redirect / /clinica/;

        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript text/css;

        sub_filter 'href="/' 'href="/clinica/';
        sub_filter 'src="/' 'src="/clinica/';
        sub_filter 'action="/' 'action="/clinica/';

        sub_filter 'fetch("/' 'fetch("/clinica/';
        sub_filter 'axios.get("/' 'axios.get("/clinica/';
        sub_filter 'axios.post("/' 'axios.post("/clinica/';
        sub_filter 'axios.put("/' 'axios.put("/clinica/';
        sub_filter 'axios.delete("/' 'axios.delete("/clinica/';

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================
    # DEAVisitas FRONTEND WEB (Puerto 3005)
    # ==========================================================
    location /visitas/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect / /visitas/;

        proxy_set_header Accept-Encoding "";

        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript text/css;

        sub_filter 'href="/' 'href="/visitas/';
        sub_filter 'src="/' 'src="/visitas/';
        sub_filter 'action="/' 'action="/visitas/';

        sub_filter 'fetch("/' 'fetch("/visitas/';
        sub_filter 'axios.get("/' 'axios.get("/visitas/';
        sub_filter 'axios.post("/' 'axios.post("/visitas/';
        sub_filter 'axios.put("/' 'axios.put("/visitas/';
        sub_filter 'axios.delete("/' 'axios.delete("/visitas/';

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ==========================================================
    # DEATurnos Raíz y WebSockets (Puerto 5000)
    # ==========================================================
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
